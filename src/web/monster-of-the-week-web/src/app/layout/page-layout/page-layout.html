<div class="page-layout">
  <header class="top-bar">
    <h1>Monster of the Week</h1>
    <nav>
      <a routerLink="/mysteries" routerLinkActive="active-link">Mysteries</a>
      <a routerLink="/health-status" routerLinkActive="active-link">Health</a>
    </nav>
  </header>
  <main>
    <router-outlet />
  </main>

  <aside class="toast-stack" aria-live="polite">
    @for (notification of notificationService.notifications(); track notification.id) {
      <div class="toast" [class.toast-error]="notification.kind === 'error'">
        <span>{{ notification.message }}</span>
        <button type="button" (click)="notificationService.dismiss(notification.id)" aria-label="Dismiss notification">
          ×
        </button>
      </div>
    }
  </aside>
</div>
