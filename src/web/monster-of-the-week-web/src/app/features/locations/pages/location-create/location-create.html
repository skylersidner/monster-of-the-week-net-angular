<section class="text-primary">
  <a class="back-link" routerLink="/locations">← Back to locations</a>

  <h2>New Location</h2>

  @if (errorMessage()) {
    <p class="text-danger">{{ errorMessage() }}</p>
  }

  @if (isSaving()) {
    <p class="text-primary font-semibold">Creating location...</p>
  }

  <app-location-form
    [location]="null"
    [locationTypes]="locationTypes()"
    [mysteries]="mysteries()"
    [isSaving]="isSaving()"
    submitLabel="Create Location"
    (save)="onCreate($event)"
  ></app-location-form>

  <!--
    **Introduced, not edited** (§13.4). Monster and minion create already carried a sentence
    naming their four staged types and 5a/5b widened it; this page had no draft panels at all, so
    the staged-write model has never been explained here. Same voice as the other two.
  -->
  <p class="text-muted text-[0.9rem] mb-3 mt-6">
    Custom moves added below are saved together with the location when you press Create Location.
  </p>

  <app-custom-moves-card
    ownerType="Location"
    [rows]="customMoveRows()"
    [(editingKey)]="editingCustomMoveKey"
    [busy]="isSaving()"
    emptyText="No custom moves added yet."
    (committed)="commitCustomMoveDraft($event)"
    (removeRequested)="removeCustomMoveDraft($event)"
  />
</section>
