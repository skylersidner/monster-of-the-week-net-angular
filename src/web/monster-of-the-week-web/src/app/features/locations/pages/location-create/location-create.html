<section class="text-primary">
  <a class="back-link" routerLink="/locations">← Back to locations</a>

  <h2>New Location</h2>

  @if (errorMessage()) {
    <p class="text-danger">{{ errorMessage() }}</p>
  }

  @if (isSaving()) {
    <p class="text-primary font-semibold">Creating location...</p>
  }

  <app-location-form
    [location]="null"
    [locationTypes]="locationTypes()"
    [mysteries]="mysteries()"
    [isSaving]="isSaving()"
    submitLabel="Create Location"
    (save)="onCreate($event)"
  ></app-location-form>
</section>
