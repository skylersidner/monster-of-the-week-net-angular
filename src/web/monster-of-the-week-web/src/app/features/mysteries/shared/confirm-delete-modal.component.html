@if (visible) {
  <div class="modal-backdrop" (click)="onBackdropClick()">
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      (click)="$event.stopPropagation()"
    >
      <h3 id="modal-title" class="modal-title">Delete "{{ itemName }}"?</h3>
      <p class="modal-message">This cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn--cancel" (click)="onCancel()">Cancel</button>
        <button type="button" class="modal-btn modal-btn--delete" (click)="onConfirm()">Delete</button>
      </div>
    </div>
  </div>
}
