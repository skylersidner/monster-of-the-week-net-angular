@if (store.currentStep() === 0) {
  <form [formGroup]="store.conceptForm">
    <div class="field">
      <label for="name">Mystery Name <span class="required">*</span></label>
      <input id="name" type="text" formControlName="name" placeholder="Give your mystery a name" />
      @if (store.conceptForm.controls.name.invalid && store.conceptForm.controls.name.touched) {
        <span class="field-error">Name is required</span>
      }
    </div>
    <div class="field">
      <label for="concept">Concept</label>
      <textarea
        id="concept"
        formControlName="concept"
        rows="4"
        placeholder="The one-sentence truth of the threat..."></textarea>
    </div>
  </form>
}

@if (store.currentStep() === 1) {
  <form [formGroup]="store.hookForm">
    <div class="field">
      <label for="hook">Hook</label>
      <textarea
        id="hook"
        formControlName="hook"
        rows="6"
        placeholder="How do the hunters first encounter this mystery?"></textarea>
    </div>
  </form>
}

@if (store.currentStep() === 2) {
  <form [formGroup]="store.overviewForm">
    <div class="field">
      <label for="overview">Overview</label>
      <textarea
        id="overview"
        formControlName="overview"
        rows="8"
        placeholder="What's really going on? Tell the full story that the hunters will uncover."></textarea>
    </div>
  </form>
}

@if (store.currentStep() === 3) {
  <form [formGroup]="store.countdownForm">
    <div class="countdown-grid">
      <div class="field">
        <label for="day">Day</label>
        <input id="day" type="text" formControlName="day" placeholder="First sign of trouble..." />
      </div>
      <div class="field">
        <label for="shadows">Shadows</label>
        <input id="shadows" type="text" formControlName="shadows" placeholder="Things escalate..." />
      </div>
      <div class="field">
        <label for="sunset">Sunset</label>
        <input id="sunset" type="text" formControlName="sunset" placeholder="The threat becomes visible..." />
      </div>
      <div class="field">
        <label for="dusk">Dusk</label>
        <input id="dusk" type="text" formControlName="dusk" placeholder="People are in danger..." />
      </div>
      <div class="field">
        <label for="nightfall">Nightfall</label>
        <input id="nightfall" type="text" formControlName="nightfall" placeholder="Death and destruction..." />
      </div>
      <div class="field">
        <label for="midnight">Midnight</label>
        <input id="midnight" type="text" formControlName="midnight" placeholder="Catastrophe..." />
      </div>
    </div>
  </form>
}
