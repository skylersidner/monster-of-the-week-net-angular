<div class="mystery-create wizard">
  <app-mystery-create-tracker />

  <div class="content-area">
    <section class="form-panel">
      <div class="step-label">Phase {{ store.currentPhase() + 1 }} · Step {{ store.currentStep() + 1 }}</div>
      <h1 class="step-title">
        <span class="heading-with-icon">
          <app-mystery-section-icon [kind]="store.currentSectionIcon()" />
          <span>{{ store.stepTitle() }}</span>
        </span>
      </h1>
      <p class="step-blurb">{{ store.stepBlurb() }}</p>

      @switch (store.currentPhase()) {
        @case (0) {
          <app-mystery-create-mystery-phase />
        }
        @case (1) {
          <app-mystery-create-monster-phase />
        }
        @case (2) {
          <app-mystery-create-locations-phase />
        }
        @case (3) {
          <app-mystery-create-bystanders-phase />
        }
      }

      @if (store.submitError()) {
        <p class="submit-error">{{ store.submitError() }}</p>
      }

      <div class="nav-buttons">
        <button type="button" class="btn-back" [disabled]="!store.canGoBack()" (click)="store.back()">← Back</button>
        <button type="button" class="btn-next" [disabled]="store.isSubmitting()" (click)="store.next()">
          @if (store.isSubmitting()) { Saving… } @else if (store.currentPhase() === store.lastPhaseIndex) { Finish } @else { Next → }
        </button>
      </div>
    </section>

    <aside class="dossier-panel">
      <app-mystery-create-dossier />
    </aside>
  </div>
</div>
