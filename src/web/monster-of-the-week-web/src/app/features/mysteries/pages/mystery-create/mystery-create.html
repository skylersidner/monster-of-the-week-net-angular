<app-wizard-layout
  eyebrow="Phase {{ store.currentPhase() + 1 }} · Step {{ store.currentStep() + 1 }}"
  [title]="store.stepTitle()"
  [blurb]="store.stepBlurb()"
  [error]="store.submitError()"
  [stepKey]="stepKey()">
  <app-wizard-tracker
    wizardTracker
    [steps]="trackerSteps()"
    [currentIndex]="store.currentPhase()"
    [currentSubIndex]="store.currentStep()"
    [iconTemplate]="phaseIcon"
    (jump)="store.jumpToPhase($event)" />

  <app-mystery-section-icon wizardTitleIcon [kind]="store.currentSectionIcon()" />

  @switch (store.currentPhase()) {
    @case (0) {
      <app-mystery-create-mystery-phase />
    }
    @case (1) {
      <app-mystery-create-monster-phase />
    }
    @case (2) {
      <app-mystery-create-locations-phase />
    }
    @case (3) {
      <app-mystery-create-bystanders-phase />
    }
  }

  <button wizardFooter type="button" class="bg-transparent border border-strong rounded-lg text-muted cursor-pointer font-[inherit] text-[0.9rem] px-5 py-[0.55rem] transition-colors disabled:cursor-not-allowed disabled:opacity-40" [disabled]="!store.canGoBack()" (click)="store.back()">← Back</button>
  <button wizardFooter type="button" class="bg-accent border-0 rounded-lg text-on-accent cursor-pointer font-[inherit] text-[0.9rem] font-semibold px-6 py-[0.55rem] hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-70 transition-colors" [disabled]="store.isSubmitting()" (click)="store.next()">
    @if (store.isSubmitting()) { Saving… } @else if (store.currentPhase() === store.lastPhaseIndex) { Finish } @else { Next → }
  </button>

  <app-mystery-create-dossier wizardAside />
</app-wizard-layout>

<ng-template #phaseIcon let-step>
  <app-mystery-section-icon [kind]="step.icon" />
</ng-template>
