<div class="mystery-create flex flex-col h-full">
  <app-mystery-create-tracker />

  <div class="flex flex-1 min-h-0">
    <section class="bg-surface border-r border-default flex flex-col overflow-y-auto p-8 w-[42%]">
      <div class="text-muted text-[0.8rem] font-semibold tracking-wide mb-[0.4rem] uppercase">Phase {{ store.currentPhase() + 1 }} · Step {{ store.currentStep() + 1 }}</div>
      <h1 class="text-primary text-[1.4rem] font-bold leading-[1.3] mb-3">
        <span class="inline-flex items-center gap-[0.5rem]">
          <app-mystery-section-icon [kind]="store.currentSectionIcon()" />
          <span>{{ store.stepTitle() }}</span>
        </span>
      </h1>
      <p class="text-muted text-[0.95rem] leading-[1.65] mb-7">{{ store.stepBlurb() }}</p>

      @switch (store.currentPhase()) {
        @case (0) {
          <app-mystery-create-mystery-phase />
        }
        @case (1) {
          <app-mystery-create-monster-phase />
        }
        @case (2) {
          <app-mystery-create-locations-phase />
        }
        @case (3) {
          <app-mystery-create-bystanders-phase />
        }
      }

      @if (store.submitError()) {
        <p class="bg-danger-subtle border border-default rounded-md text-danger text-sm mb-3 px-3 py-[0.6rem]">{{ store.submitError() }}</p>
      }

      <div class="flex items-center justify-end gap-3 mt-auto pt-6">
        <button type="button" class="bg-transparent border border-strong rounded-lg text-muted cursor-pointer font-[inherit] text-[0.9rem] px-5 py-[0.55rem] transition-colors disabled:cursor-not-allowed disabled:opacity-40" [disabled]="!store.canGoBack()" (click)="store.back()">← Back</button>
        <button type="button" class="bg-accent border-0 rounded-lg text-on-accent cursor-pointer font-[inherit] text-[0.9rem] font-semibold px-6 py-[0.55rem] hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-70 transition-colors" [disabled]="store.isSubmitting()" (click)="store.next()">
          @if (store.isSubmitting()) { Saving… } @else if (store.currentPhase() === store.lastPhaseIndex) { Finish } @else { Next → }
        </button>
      </div>
    </section>

    <aside class="bg-surface-sunken flex-1 overflow-y-auto p-8">
      <app-mystery-create-dossier />
    </aside>
  </div>
</div>
