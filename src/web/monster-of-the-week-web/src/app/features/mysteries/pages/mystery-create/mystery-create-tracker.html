<header class="tracker bg-surface shadow-sm shrink-0 min-h-[80px] py-3 px-8">
  @for (phase of store.phases; track phase.index) {
    @if (phase.index > 0) {
      <div
        class="tracker-line bg-border-strong max-w-[80px] min-w-6"
        [class.complete]="store.phaseComplete()[phase.index - 1]"
        [style.grid-column]="phase.index * 2">
      </div>
    }

    <div class="tracker-phase" [style.grid-column]="phase.index * 2 + 1">
      <button
        type="button"
        class="phase-bubble"
        [class.active]="store.currentPhase() === phase.index"
        [class.complete]="store.phaseComplete()[phase.index]"
        [disabled]="!store.isPhaseAccessible(phase.index)"
        (click)="store.jumpToPhase(phase.index)">
        @if (store.phaseComplete()[phase.index]) { ✓ } @else { {{ phase.index + 1 }} }
      </button>

      <span class="inline-flex items-center text-muted text-xs gap-[0.35rem] font-semibold">
        <app-mystery-section-icon [kind]="phase.icon" />
        <span>{{ phase.name }}</span>
      </span>

      <div class="flex gap-[0.3rem]">
        @if (phase.steps > 1) {
          @for (step of phase.stepsArray; track step) {
            <span
              class="step-dot"
              [class.active]="store.currentPhase() === phase.index && store.currentStep() === step"
              [class.complete]="
                store.phaseStepComplete()[phase.index]?.[step] ||
                (store.currentPhase() === phase.index && store.currentStep() > step)
              ">
            </span>
          }
        }
      </div>
    </div>
  }
</header>
