<div class="flex flex-col gap-[0.4rem] mb-3">
  @for (location of store.locations(); track $index) {
    <div class="flex items-center bg-surface-sunken border border-default rounded-md text-primary text-[0.9rem] justify-between px-3 py-2">
      <span>{{ location.name }}</span>
      <button type="button" class="bg-transparent border-0 text-danger cursor-pointer text-[1.1rem] leading-none px-1" (click)="store.removeLocation($index)">×</button>
    </div>
  }
  @if (store.locations().length === 0) {
    <p class="text-muted text-sm italic">No locations added yet.</p>
  }
</div>

<form [formGroup]="store.addLocationForm" class="border border-default rounded-lg mt-4 p-4">
  <div class="mb-4">
    <label class="text-primary block text-sm font-semibold mb-[0.35rem]">Location Name <span class="text-danger">*</span></label>
    <input formControlName="name" placeholder="The old mill, the forest clearing..."
      class="bg-surface border border-strong rounded-lg text-primary font-[inherit] px-3 py-[0.6rem] w-full focus:border-accent focus:outline-none focus:ring-focus" />
  </div>
  <div class="mb-4">
    <label class="text-primary block text-sm font-semibold mb-[0.35rem]">Description</label>
    <textarea formControlName="description" rows="3"
      class="bg-surface border border-strong rounded-lg text-primary font-[inherit] px-3 py-[0.6rem] w-full min-h-[100px] resize-y focus:border-accent focus:outline-none focus:ring-focus"></textarea>
  </div>
  <div class="mb-4">
    <label class="text-primary block text-sm font-semibold mb-[0.35rem]">Type <span class="text-danger">*</span></label>
    <app-custom-select formControlName="locationTypeId" [options]="store.locationTypes()" placeholder="Select a type..."></app-custom-select>
  </div>
  <button type="button" class="bg-transparent border border-accent rounded-md text-accent cursor-pointer font-[inherit] text-sm font-semibold mt-2 px-[0.9rem] py-[0.45rem] hover:bg-accent-subtle transition-colors" (click)="store.addLocation()">+ Add Location</button>
</form>
