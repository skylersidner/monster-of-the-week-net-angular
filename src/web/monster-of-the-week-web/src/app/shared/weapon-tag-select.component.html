<div class="flex flex-col gap-[0.35rem]">
  @if (selectedTags().length > 0) {
    <div class="flex flex-wrap gap-[0.35rem]">
      @for (tag of selectedTags(); track tag.id) {
        <span class="bg-weapon-chip border border-weapon-chip-line rounded-full text-on-weapon-chip text-xs leading-none px-[0.6rem] py-1">{{ tag.name }}</span>
      }
    </div>
  }
  <span class="text-primary text-sm font-medium">Weapon Tags</span>
  <app-custom-select
    [formControl]="innerControl"
    [options]="options"
    [multiple]="true"
    [searchable]="true"
    [placeholder]="placeholder"
  ></app-custom-select>
</div>
