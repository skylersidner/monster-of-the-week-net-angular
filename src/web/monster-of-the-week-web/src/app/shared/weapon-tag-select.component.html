<div class="flex flex-col gap-[0.35rem]">
  @if (selectedTags().length > 0) {
    <div [class]="compact ? 'flex flex-wrap gap-1' : 'flex flex-wrap gap-[0.35rem]'">
      @for (tag of selectedTags(); track tag.id) {
        <span [class]="compact
          ? 'bg-weapon-chip border border-weapon-chip-line rounded-full text-on-weapon-chip leading-none text-[0.7rem] px-2 py-[0.15rem]'
          : 'bg-weapon-chip border border-weapon-chip-line rounded-full text-on-weapon-chip leading-none text-xs px-[0.6rem] py-1'"
        >{{ tag.name }}</span>
      }
    </div>
  }
  @if (!compact) {
    <span class="text-primary text-sm font-medium">Weapon Tags</span>
  }
  <app-custom-select
    [formControl]="innerControl"
    [options]="options"
    [multiple]="true"
    [searchable]="true"
    [placeholder]="placeholder"
    [size]="compact ? 'compact' : 'default'"
  ></app-custom-select>
</div>
