<div class="relative flex items-center text-slate-400 w-full" role="search">
  <label class="sr-only" for="header-search-input">Search</label>
  <svg class="absolute left-3 pointer-events-none h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
  </svg>
  <input
    id="header-search-input"
    type="search"
    role="combobox"
    autocomplete="off"
    placeholder="Search mysteries, monsters, minions, locations, bystanders…"
    class="border border-slate-200 rounded-[0.55rem] text-slate-950 text-[0.94rem] py-[0.58rem] pl-[2.2rem] pr-3 w-full focus:border-indigo-500 focus:shadow-[0_0_0_2px_rgba(99,102,241,0.18)] focus:outline-none"
    [value]="query()"
    aria-autocomplete="list"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="activeDescendantId()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />

  @if (isOpen()) {
    <ul
      [id]="listboxId"
      role="listbox"
      class="header-search__listbox absolute left-0 top-[calc(100%_+_0.35rem)] z-20 w-full bg-white border border-slate-200 rounded-[0.7rem] shadow-[0_16px_36px_rgba(15,23,42,0.14)] max-h-[280px] overflow-y-auto py-1"
      (mousedown)="$event.preventDefault()"
    >
      @if (results().length > 0) {
        @for (result of results(); track result.entityType + result.id; let i = $index) {
          <li
            [id]="'header-search-option-' + i"
            role="option"
            [attr.aria-selected]="highlightedIndex() === i"
            [attr.aria-label]="result.entityType + ': ' + result.name"
            class="header-search__option flex items-center gap-[0.6rem] px-[0.8rem] py-[0.6rem] cursor-pointer text-slate-950"
            [class.is-highlighted]="highlightedIndex() === i"
            (mouseenter)="setHighlighted(i)"
            (click)="selectResult(result, i)"
          >
            <app-domain-icon [domain]="result.entityType" aria-hidden="true" />
            <span aria-hidden="true" class="overflow-hidden text-ellipsis whitespace-nowrap">{{ result.name }}</span>
          </li>
        }
      } @else {
        <li role="presentation" class="px-[0.8rem] py-[0.6rem] text-slate-500 text-[0.9rem] cursor-default">
          No results found for "{{ query() }}"
        </li>
      }
    </ul>
  }
</div>
