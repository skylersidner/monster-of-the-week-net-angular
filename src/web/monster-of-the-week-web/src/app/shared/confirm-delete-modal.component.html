@if (visible) {
  <div class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/45" (click)="onBackdropClick()">
    <div
      class="bg-white rounded-xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] max-w-[420px] w-[90%] p-8"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      (click)="$event.stopPropagation()"
    >
      <h3 id="modal-title" class="text-blue-900 text-xl font-bold mb-2 break-words">Delete "{{ itemName }}"?</h3>
      @if (items.length > 0) {
        <p class="text-gray-500 text-[0.95rem] mb-3">{{ message }}</p>
        <ul class="bg-gray-50 border border-gray-200 rounded-md text-gray-700 text-[0.9rem] list-disc mb-3 max-h-[150px] overflow-y-auto py-2 pr-2 pl-7">
          @for (item of items; track item) {
            <li class="py-0.5">{{ item }}</li>
          }
        </ul>
        <p class="text-gray-400 text-sm mb-6">This cannot be undone.</p>
      } @else {
        <p class="text-gray-500 text-[0.95rem] mb-3">{{ message }}</p>
      }
      <div class="flex justify-end gap-3">
        <button type="button" class="border-none rounded-md cursor-pointer text-[0.9rem] font-semibold px-5 py-2 transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200" (click)="onCancel()">Cancel</button>
        <button type="button" class="border-none rounded-md cursor-pointer text-[0.9rem] font-semibold px-5 py-2 transition-colors bg-red-600 text-white hover:bg-red-700" (click)="onConfirm()">Delete</button>
      </div>
    </div>
  </div>
}
