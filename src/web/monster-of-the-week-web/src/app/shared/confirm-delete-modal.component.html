@if (visible) {
  <div class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950/55" (click)="onBackdropClick()">
    <div
      class="bg-surface-raised rounded-xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] max-w-[420px] w-[90%] p-8"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      (click)="$event.stopPropagation()"
    >
      <h3 id="modal-title" class="text-primary text-xl font-bold mb-2 break-words">{{ verb }} "{{ itemName }}"?</h3>
      @if (items.length > 0) {
        <p class="text-muted text-[0.95rem] mb-3">{{ message }}</p>
        <ul class="bg-surface-sunken border border-default rounded-md text-secondary text-[0.9rem] list-disc mb-3 max-h-[150px] overflow-y-auto py-2 pr-2 pl-7">
          @for (item of items; track item) {
            <li class="py-0.5">{{ item }}</li>
          }
        </ul>
        @if (permanenceNote) {
          <p class="text-muted text-sm mb-6">{{ permanenceNote }}</p>
        }
      } @else {
        <p class="text-muted text-[0.95rem] mb-3">{{ message }}</p>
      }
      <div class="flex justify-end gap-3">
        <button type="button" class="border-none rounded-md cursor-pointer text-[0.9rem] font-semibold px-5 py-2 transition-colors bg-surface-sunken text-secondary hover:bg-surface-hover" (click)="onCancel()">Cancel</button>
        <button type="button" class="border-none rounded-md cursor-pointer text-[0.9rem] font-semibold px-5 py-2 transition-colors bg-danger text-on-danger hover:bg-danger-hover" (click)="onConfirm()">{{ verb }}</button>
      </div>
    </div>
  </div>
}
