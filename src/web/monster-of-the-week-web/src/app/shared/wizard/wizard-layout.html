<!-- text-primary: the shell paints the column and aside surfaces, so it sets their foreground too. Projected content that sets no colour of its own inherits the theme's text colour instead of the browser's black. -->
<div class="wizard-layout flex flex-col h-full text-primary">
  <ng-content select="[wizardTracker]" />

  <div class="flex flex-1 min-h-0">
    <section #column class="bg-surface md:border-r border-default flex flex-col overflow-y-auto p-4 md:p-8 w-full md:w-[42%] min-w-0">
      <div class="text-muted text-[0.8rem] font-semibold tracking-wide mb-[0.4rem] uppercase">{{ eyebrow }}</div>
      <h1 #heading tabindex="-1" class="text-primary text-[1.4rem] font-bold leading-[1.3] mb-3 focus:outline-none">
        <span class="inline-flex items-center gap-[0.5rem]">
          <ng-content select="[wizardTitleIcon]" />
          <span>{{ title }}</span>
        </span>
      </h1>
      <p class="text-muted text-[0.95rem] leading-[1.65] mb-7">{{ blurb }}</p>

      <ng-content />

      @if (error) {
        <p class="bg-danger-subtle border border-default rounded-md text-danger text-sm mb-3 px-3 py-[0.6rem]">{{ error }}<ng-content select="[wizardErrorAction]" /></p>
      }

      <div class="flex items-center justify-end gap-3 mt-auto pt-6">
        <ng-content select="[wizardFooter]" />
      </div>
    </section>

    <aside class="bg-surface-sunken flex-1 overflow-y-auto p-8 max-md:hidden">
      <ng-content select="[wizardAside]" />
    </aside>
  </div>
</div>
