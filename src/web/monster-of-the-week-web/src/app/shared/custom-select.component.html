<div class="custom-select relative w-full" [class.is-open]="isOpen()" [class.is-disabled]="disabled" [class.multiple-select]="multiple">
  <button type="button" class="custom-select__trigger" [disabled]="disabled" (click)="toggleOpen()" [attr.aria-expanded]="isOpen()">
    <span class="overflow-hidden text-left truncate">
      {{ displayText() }}
      @if (selectedTriggerSubLabel()) {
        <span class="text-slate-500 text-[0.85em] font-normal ml-[0.3rem]">({{ selectedTriggerSubLabel() }})</span>
      }
    </span>
    <span class="custom-select__caret text-slate-500 text-[0.9rem] -translate-y-px">▾</span>
  </button>

  @if (isOpen()) {
    <div class="custom-select__panel absolute left-0 top-[calc(100%_+_0.1rem)] mt-[0.35rem] w-full bg-white border border-slate-200 rounded-[0.7rem] shadow-[0_16px_36px_rgba(15,23,42,0.14)] max-h-[280px] overflow-hidden z-20">
      @if (searchable) {
        <div class="custom-select__search border-b border-slate-100 p-[0.55rem]">
          <input
            type="text"
            [value]="searchTerm()"
            (input)="searchTerm.set($any($event.target).value)"
            placeholder="Search options"
          />
        </div>
      }

      <div class="flex flex-col max-h-[220px] overflow-y-auto" role="listbox">
        @if (filteredOptions().length === 0) {
          <div class="text-slate-500 p-[0.8rem]">{{ emptyText }}</div>
        }

        @for (option of filteredOptions(); track optionValue(option)) {
          <button
            type="button"
            class="custom-select__option"
            [class.is-selected]="isOptionSelected(option)"
            (click)="selectOption(option)"
          >
            @if (multiple && isOptionSelected(option)) {
              <span class="text-indigo-600 text-[0.9rem]">✓</span>
            }
            <span class="flex flex-col gap-[0.1rem] min-w-0">
              <span class="overflow-hidden text-ellipsis whitespace-nowrap">{{ optionLabel(option) }}</span>
              @if (optionSubLabel(option)) {
                <span class="custom-select__option-sublabel text-slate-500 text-[0.78rem] font-normal leading-[1.3] overflow-hidden text-ellipsis whitespace-nowrap">{{ optionSubLabel(option) }}</span>
              }
            </span>
          </button>
        }
      </div>
    </div>
  }
</div>
